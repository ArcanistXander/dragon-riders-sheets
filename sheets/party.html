<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon Riders of Arcanum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one DM-screen ledger. Summary strip of party weak points, one row per rider, each with a fold-out dragon row tied to it. */
:root{
  --bg:#eef0eb; --panel:#f8f9f6; --ink:#1c2226; --muted:#5d676b; --rule:#cfd5cf;
  --accent:#1f6f62; --accent-soft:#d8ebe6; --fly:#8a5a12; --fly-soft:#f2e6cf;
  --weak:#a3322a; --weak-soft:#f6dcd8; --good:#2d6a2f;
  --display:"Alegreya SC",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14191b; --panel:#1c2326; --ink:#e3e8e5; --muted:#97a3a4; --rule:#2f393c;
  --accent:#5fbfae; --accent-soft:#1f3a36; --fly:#e0b267; --fly-soft:#3a2f1d;
  --weak:#f08a7f; --weak-soft:#43211e; --good:#8fd093; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191b; --panel:#1c2326; --ink:#e3e8e5; --muted:#97a3a4; --rule:#2f393c;
  --accent:#5fbfae; --accent-soft:#1f3a36; --fly:#e0b267; --fly-soft:#3a2f1d;
  --weak:#f08a7f; --weak-soft:#43211e; --good:#8fd093; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:2rem;margin:0;line-height:1.05;text-wrap:balance}
h3{font-family:var(--display);font-size:1.05rem;margin:0;font-weight:700}
.sub{color:var(--muted);margin:4px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:500;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.mini{padding:1px 8px;font-size:.8rem}
.status{color:var(--muted);font-size:.9rem;align-self:center}
.notice{background:var(--fly-soft);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:.92rem;margin:0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:grid;gap:2px}
.sum .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sum .v{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.sum .w{font-size:.85rem;color:var(--muted)}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-variant-numeric:tabular-nums}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px 6px;border-bottom:2px solid var(--rule);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.rider td{border-bottom:0}
tr.drow td{padding:0 10px 14px}
tr:last-child td{border-bottom:0}
.name{font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.1}
.race{color:var(--muted);font-size:.88rem}
.cls{font-size:.92rem}
.lvl{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:4px;padding:0 6px;font-size:.82rem;margin-right:4px}
.big{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1}
.minor{color:var(--muted);font-size:.82rem}
.num{text-align:center}
.save{display:inline-block;min-width:2.2em;text-align:center;font-weight:700;font-size:1rem;padding:1px 4px;border-radius:4px}
.save.weak{background:var(--weak-soft);color:var(--weak)}
.save.strong{color:var(--good)}
.saves{display:grid;grid-template-columns:repeat(3,auto);gap:4px 8px;justify-content:start}
.sv{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.sv .lbl{width:2.2em}
.prof{font-style:normal;color:var(--accent);font-size:.6rem}
.flag{font-size:.68rem;font-weight:700;border-radius:3px;padding:0 4px}
.flag.fail{background:var(--weak);color:var(--panel)}
.flag.dis{background:var(--weak-soft);color:var(--weak)}
.fly{display:inline-block;background:var(--fly-soft);color:var(--fly);border-radius:4px;padding:1px 6px;font-weight:700;white-space:nowrap}
.note{font-size:.86rem;color:var(--muted);max-width:28ch}
.hp{display:grid;gap:4px;min-width:200px}
.hpbar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--accent)}
.hpbar i.low{background:var(--weak)}
.hprow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:3px 6px;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
textarea{min-height:3.6em;resize:vertical;font-size:.88rem}
input.n{width:4em;text-align:center}
input[type=color]{width:3em;height:1.9em;padding:1px}
input[type=checkbox]{width:auto}
select{font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:3px 4px;min-width:0;flex:1}
.edit td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.stack{display:grid;gap:4px}
.lbl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dmg{display:flex;gap:4px}
.dmgbtns{display:flex;gap:4px}
.dmgbtns button{flex:1;padding:3px 6px;font-size:.85rem}
button.hurt{color:var(--weak)}
button.heal{color:var(--good)}
.log{font-size:.8rem;color:var(--ink);background:var(--bg);border-radius:4px;padding:3px 6px}
.death{display:grid;gap:3px;background:var(--weak-soft);border-radius:4px;padding:4px 6px}
.dsrow{display:flex;align-items:center;gap:4px}
.dsrow .lbl{width:5.5em}
.dead{color:var(--weak);font-weight:700}
.stable{color:var(--good);font-weight:700}
.pips{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.pip{width:16px;height:16px;padding:0;border-radius:50%;border:2px solid var(--fly);background:transparent}
.pip.on{background:var(--fly)}
.pip.f{border-color:var(--weak)} .pip.f.on{background:var(--weak)}
.pip.s{border-color:var(--good)} .pip.s.on{background:var(--good)}
.conds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:240px}
.chip{font-size:.75rem;padding:1px 8px;border-radius:999px;color:var(--muted)}
.chip.on{background:var(--weak-soft);color:var(--weak);border-color:var(--weak);font-weight:700}
.chip.good.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.insp.on{background:var(--fly-soft);color:var(--fly);border-color:var(--fly)}
.effects{font-size:.78rem;color:var(--weak);margin-top:4px;max-width:240px}
.neg{display:flex;align-items:center;gap:5px;margin-top:6px}
.step{padding:0;width:22px;height:22px;line-height:1;font-weight:700}
.negn{min-width:1.2em;text-align:center;font-weight:700;color:var(--muted)}
.negn.on{color:var(--weak)}
.drained{font-size:.8rem;color:var(--weak);font-weight:700;white-space:nowrap}
.spd{font-size:.78rem;color:var(--weak);font-weight:700}
/* Dragon fold-out */
.dtoggle{width:100%;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;text-align:left;border-left:5px solid var(--gem,var(--fly));background:var(--bg);border-radius:6px;padding:7px 12px}
.dtoggle[aria-expanded=true]{border-bottom-left-radius:0;border-bottom-right-radius:0}
.caret{display:inline-block;transition:transform .15s;color:var(--muted)}
.dtoggle[aria-expanded=true] .caret{transform:rotate(90deg)}
.gem{width:12px;height:12px;border-radius:3px;background:var(--gem,var(--fly));transform:rotate(45deg);flex:none}
.dname{font-family:var(--display);font-weight:700;font-size:1.02rem}
.pill{font-size:.8rem;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:0 8px;white-space:nowrap}
.pill.down{background:var(--weak-soft);color:var(--weak);border-color:var(--weak);font-weight:700}
.mini-bar{display:inline-block;width:56px;height:5px;background:var(--rule);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:4px}
.mini-bar i{display:block;height:100%;background:var(--accent)}
.mini-bar i.low{background:var(--weak)}
.dpanel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:14px;border:1px solid var(--rule);border-top:0;border-left:5px solid var(--gem,var(--fly));border-radius:0 0 6px 6px;background:var(--bg)}
.dcol{display:grid;gap:10px;align-content:start;min-width:0}
.dcol h3{border-bottom:1px solid var(--rule);padding-bottom:3px}
.pair{display:flex;gap:18px;flex-wrap:wrap}
.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.score{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:3px 0}
.score b{display:block;font-size:1rem}
.feat{display:grid;gap:2px}
.fhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fname{font-family:var(--display);font-weight:700}
.ftext{font-size:.88rem}
.rech{font-size:.72rem;font-weight:700;border-radius:3px;padding:0 5px}
.rech.ready{background:var(--accent-soft);color:var(--accent)}
.rech.spent{background:var(--weak-soft);color:var(--weak)}
.rulebox{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--rule);padding-top:6px;margin:0}
.bondlist{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:.84rem}
.bondlist li.locked{color:var(--muted);opacity:.6}
.bondlist b{font-weight:700}
.tac{font-size:.84rem;display:grid;gap:1px}
.tac .t{font-weight:700}
.tac .a{color:var(--muted);font-size:.75rem}
.wardfx{font-size:.8rem;color:var(--accent)}
.fedit{display:grid;gap:4px;border:1px solid var(--rule);border-radius:6px;padding:6px;background:var(--panel)}
.frow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.frow input:not(.n){flex:1;min-width:8em}
.scoregrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.scoregrid input{width:100%}
.profs{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem}
.profs label{display:flex;gap:3px;align-items:center}
footer{color:var(--muted);font-size:.85rem;display:grid;gap:4px}
dialog{border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-sizing:border-box;padding:16px}
dialog::backdrop{background:rgb(0 0 0 / .5)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.dlg-head h2{font-family:var(--display);margin:0;font-size:1.4rem}
dialog textarea{min-height:240px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
/* Live sheets: riders whose own sheet is on this site report here; the DM can switch any of them to Paper */
.livetog{display:inline-block;margin-top:4px;padding:1px 8px;font-size:.75rem;border-radius:999px;color:var(--muted);font-weight:700}
.livetog.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.live{font-size:.78rem;color:var(--accent);font-weight:700;margin-top:2px}
.live.stale{color:var(--weak)}
.chip.pend{border:1px dashed currentColor;opacity:.75}
.cdur{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:6px;max-width:240px}
.cdur input{width:3.2em}.cdur button{padding:2px 8px;font-size:.8rem}
/* Party / Initiative tabs */
.vtabs{display:flex;gap:2px;border-bottom:2px solid var(--rule);overflow-x:auto}
.vtabs button{border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);padding:8px 16px;margin-bottom:-2px;font-family:var(--display);font-size:1.05rem;white-space:nowrap}
.vtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
/* Initiative tracker: turn order on the left, timed effects on the right */
.ini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:16px;align-items:start}
@media (max-width:860px){.ini{grid-template-columns:minmax(0,1fr)}}
.ini-main{display:grid;gap:12px}
.ini-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.ini-round{display:grid;justify-items:center;min-width:64px}
.ini-round .rn{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ini-now{display:grid;gap:2px;flex:1;min-width:180px}
.ini-now b{font-family:var(--display);font-size:1.45rem;line-height:1.1}
.ini-ctl,.ini-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ini-alert{background:var(--weak-soft);color:var(--weak);border-radius:6px;padding:8px 12px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.ini-list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.ini-row{display:grid;grid-template-columns:1.25rem 4.75rem minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 14px 10px 10px;border-bottom:1px solid var(--rule)}
.ini-row:last-child{border-bottom:0}
.ini-row.cur{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.ini-row.held{background:var(--fly-soft)}
.ini-row.out .name{color:var(--muted)}
.ini-mark{color:var(--accent);font-weight:700;text-align:center}
input.ini-in{width:100%;height:2.4rem;font-family:var(--display);font-size:1.15rem;font-weight:700;text-align:center}
.ini-who{display:grid;gap:2px;min-width:0}
.ini-who .name{font-size:1.15rem}
.ini-who .dmin{display:flex;flex-wrap:wrap;gap:6px}
.ini-who .dmin input{flex:1;min-width:9em;width:auto}
.ini-who input.ini-name{font-weight:700}
.ini-sub{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.85rem;color:var(--muted)}
.ini-sub .st{font-variant-numeric:tabular-nums}.ini-sub .st b{color:var(--ink);font-weight:700}
.ini-sub .chip{border:1px solid var(--weak)}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.tag.dm{background:var(--weak-soft);color:var(--weak)}
.tag.drg{background:var(--fly-soft);color:var(--fly);border-left:4px solid var(--gem,var(--fly));text-transform:none;letter-spacing:0;font-size:.8rem}
.tag.hold{background:var(--fly);color:var(--panel)}
.tag.fx{background:var(--accent-soft);color:var(--accent);text-transform:none;letter-spacing:0}
.tag.fx.ended{background:var(--weak-soft);color:var(--weak)}
.tag.down{background:var(--weak);color:var(--panel)}
.ini-act{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.ini-act button{padding:3px 9px;font-size:.85rem}
.ini-act button.step{padding:0;width:26px;height:26px}
@media (max-width:560px){.ini-row{grid-template-columns:1rem 4rem minmax(0,1fr);gap:6px 12px}.ini-act{grid-column:2/-1;justify-content:flex-start}}
.ini-row.down .ini-who input.ini-name{text-decoration:line-through;color:var(--muted)}
.mhp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px}
.mhp input.n{width:4em;padding:2px 4px}
.mhp button{padding:2px 9px;font-size:.85rem}
.mhp-g{display:inline-flex;gap:4px;align-items:center}
.mhp .hpbar{flex-basis:100%;max-width:280px}
.ini-side{display:grid;gap:10px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.ini-side h2{font-family:var(--display);margin:0;font-size:1.25rem}
.fx-form{display:grid;gap:6px}
.fx-form .r{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fx-form .r>input:not(.n){flex:1;min-width:10em;width:auto}
.fx{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;display:grid;gap:4px;background:var(--bg)}
.fx .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fx .t b{font-family:var(--display);font-size:1.05rem}
.fx .left{font-weight:700;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.fx.ended{border-color:var(--weak);background:var(--weak-soft)}
.fx.ended .left{color:var(--weak)}
.fx .b{display:flex;flex-wrap:wrap;gap:4px}
.fx .b button{padding:2px 8px;font-size:.8rem}
.pick{background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.pk-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pk-head h2{font-family:var(--display);margin:0;font-size:1.2rem}
.pk-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
.pk-row input.n{width:4.5em}
.pk-roll{display:flex;gap:6px;align-items:center;white-space:nowrap}
.pk-roll input{width:auto;accent-color:var(--accent)}
span.chip{border:1px solid var(--rule);display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script src="js/firebase-config.js"></script>
<script src="js/cloud.js"></script>
<script>
(function(){
  var DEFAULTS=document.getElementById('party-data').textContent;
  var STORE='arcanum-riders-sheet', PLAY='arcanum-riders-play';
  // Riders with their own character sheet on this site. They read it live unless switched to Paper.
  // Add a line here when a new character sheet goes up (rider id: page).
  var SHEET_PAGES={corbin:'corbin.html',breya:'breya.html',karinya:'karinya.html',haratio:'haratio.html',coltyn:'coltyn.html'};
  function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  var state=JSON.parse(DEFAULTS);
  var saved=load(STORE); if(saved&&Array.isArray(saved.party))state=saved;
  var play=load(PLAY)||{};
  function normPlay(){['hp','temp','death','cond','exh','insp','tandem','used','spent','wards','open'].forEach(function(k){if(!play[k]||typeof play[k]!=='object')play[k]={}})}
  normPlay();
  function savePlay(){put(PLAY,play);cloudPush()}
  function saveState(){put(STORE,state);cloudPush()}
  var editing=false, dirty=false, statusMsg='', ask='', backup=null, logs={}, lastType={}, rolls={};

  var AB=['str','dex','con','int','wis','cha'];
  function blankDragon(){return {name:'New dragon',kind:'',color:'#b07a2a',size:'Small',speed:'30 ft., fly 40 ft.',str:'10',dex:'10',con:'10',int:'10',wis:'10',cha:'10',saves:'',defenses:'',senses:'Blindsight 10 ft., darkvision 60 ft.',ac:'',hp:'',bond:'1',tactics:[],aspects:'',features:[{name:'Bite',text:'Melee: {hit} to hit, reach 5 ft. Hit: 1d6 + 2 piercing.'}]}}
  function fixParty(){state.party.forEach(function(p){if(!p.dragon)p.dragon=blankDragon();if(!Array.isArray(p.dragon.features))p.dragon.features=[];if(!Array.isArray(p.dragon.tactics))p.dragon.tactics=[];})}
  fixParty();

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function n(v){var x=parseInt(String(v==null?'':v).replace('−','-'),10);return isNaN(x)?null:x}
  function mod(s){var x=n(s);return x==null?null:Math.floor((x-10)/2)}
  function sg(v){return v==null?'—':(v>=0?'+':'')+v}
  function pb(p){var l=lvl(p);return l==null?2:Math.ceil(l/4)+1}
  function byId(id){return state.party.find(function(x){return x.id===id})}
  function did(p){return p.id+'-dragon'}

  // ---------- Live link: riders' own sheets report their numbers here ----------
  // A report arrives online (reports/<id>, through js/cloud.js) or, when the sheet was open in this browser, from
  // localStorage (drsheet-link:<id>). The newest one wins. A rider switched to Paper ignores their sheet.
  var links={};
  function isReport(d){return !!d&&d.t==='dr-hero'&&typeof d.id==='string'&&typeof d.at==='string'}
  function rawLink(id){
    var best=links[id]||null;
    try{var l=JSON.parse(localStorage.getItem('drsheet-link:'+id)||'null');if(isReport(l)&&l.id===id&&(!best||l.at>best.at))best=l}catch(e){}
    return best;
  }
  function acceptReport(d){if(!isReport(d)||!byId(d.id))return false;var prev=links[d.id];if(prev&&prev.at>=d.at)return false;links[d.id]=d;return true}
  function hasSheet(p){return !!(p&&SHEET_PAGES[p.id])}
  function link(p){return hasSheet(p)&&!p.paper?rawLink(p.id):null}
  function live(p){var r=link(p);return r&&r.live||null}
  function liveDragon(p){var r=link(p);return r&&r.dragon||null}
  function lvl(p){var l=live(p);return l&&l.level!=null?+l.level:n(p.level)}
  // typed stats, or the live ones: ac, init, pp, dc, speed, sstr…scha
  function stat(p,k){
    var l=live(p);
    if(l){if(k[0]==='s'&&AB.indexOf(k.slice(1))>=0){var v=l.saves&&l.saves[k.slice(1)];return v==null?null:+v}if(l[k]!=null&&l[k]!=='')return +l[k]}
    return n(p[k]);
  }
  function when(iso){
    var d=new Date(iso); if(isNaN(d)) return {rel:'',abs:'',old:true};
    var mins=Math.round((Date.now()-d)/60000);
    var rel=mins<1?'just now':mins<60?mins+' min ago':mins<1440?Math.round(mins/60)+' hr ago':Math.round(mins/1440)+' day'+(mins>=2880?'s':'')+' ago';
    return {rel:rel,abs:d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),old:mins>=720};
  }
  function liveToggle(p){
    if(!hasSheet(p)) return '';
    var on=!p.paper, r=rawLink(p.id), w=r&&when(r.at);
    return '<div><button class="livetog'+(on?' on':'')+'" data-livetog="'+p.id+'" aria-pressed="'+on+'" title="'+(on?'Reading '+esc(p.name)+'’s own sheet. Switch to Paper to track their stats here instead.':'Tracking the stats typed in here. Switch back to read '+esc(p.name)+'’s own sheet.')+'">'+(on?'● Live sheet':'○ Paper')+'</button></div>'+
      (on?(r?'<div class="live'+(w.old?' stale':'')+'" title="'+esc(w.abs)+'">Updated '+esc(w.rel)+'</div>':'<div class="live stale">Waiting for their sheet. Open it once on this site.</div>'):'');
  }
  // Switch a rider to paper (true) or back to their live sheet. Going to paper starts from the last numbers their sheet
  // sent, so nothing jumps back to old typed stats. Returns whether anything was copied.
  function setPaper(p,on){
    if(!on){delete p.paper;return false}
    if(p.paper)return false;
    var r=rawLink(p.id), copied=false, l=r&&r.live, ld=r&&r.dragon;
    if(l){
      ['level','ac','init','pp','dc','speed'].forEach(function(k){if(l[k]!=null&&l[k]!==''){p[k]=String(l[k]);copied=true}});
      if(l.classes)p.classes=l.classes; if(l.race)p.race=l.race; if(l.defenses)p.defenses=l.defenses;
      if(l.saves)AB.forEach(function(a){if(l.saves[a]!=null)p['s'+a]=String(l.saves[a])});
      if(l.hp){p.hp=String((+l.exh>=4?2:1)*(+l.hp.max||0));play.hp[p.id]=+l.hp.cur||0;if(+l.hp.temp)play.temp[p.id]=+l.hp.temp;else delete play.temp[p.id]}
      var oc=play.cond[p.id]={};(l.conds||[]).forEach(function(k){oc[k]=true});
      play.exh[p.id]=+l.exh||0; play.insp[p.id]=!!l.insp;
      if(l.death&&(l.death.s||l.death.f))play.death[p.id]={s:+l.death.s||0,f:+l.death.f||0};else delete play.death[p.id];
    }
    if(ld&&ld.hp){
      var id=did(p);play.hp[id]=+ld.hp.cur||0;if(+ld.hp.temp)play.temp[id]=+ld.hp.temp;else delete play.temp[id];
      if(ld.name)p.dragon.name=ld.name;
      p.dragon.features.forEach(function(f,i){if(f.recharge){if(ld.breathReady)delete play.spent[id+'#'+i];else play.spent[id+'#'+i]=true}});
      copied=true;
    }
    p.paper=true;return copied;
  }
  // Header button: everyone with a sheet to paper, or (when they all are) everyone back to live.
  function allPaperBtn(){
    var withSheet=state.party.filter(hasSheet); if(!withSheet.length) return '';
    return withSheet.every(function(p){return p.paper})?'<button id="all-live" title="Every rider with a sheet on the site reads it live again">All live sheets</button>':
      '<button id="all-paper" title="Track every rider from the stats typed in here, ignoring their website sheets">All on paper</button>';
  }

  // ---------- Creatures (riders and dragons share HP, conditions and death saves) ----------
  function dName(p){var ld=liveDragon(p);return (ld&&ld.name)||p.dragon.name}
  function dMax(p){var ld=liveDragon(p);if(ld&&ld.hp)return +ld.hp.max||0;var d=p.dragon,o=n(d.hp);if(o!=null)return o;return 20+(lvl(p)||1)+(mod(d.con)||0)}
  function crit(id){
    var isD=/-dragon$/.test(id), p=byId(isD?id.slice(0,-7):id); if(!p)return null;
    if(!isD){var l=live(p);return {id:id,p:p,d:false,name:p.name,max:l&&l.hp?+l.hp.max:n(p.hp),def:l?l.defenses:p.defenses,live:l&&l.hp?l.hp:null}}
    var ld=liveDragon(p);
    return {id:id,p:p,d:true,name:dName(p),max:dMax(p),def:p.dragon.defenses,live:ld&&ld.hp?ld.hp:null};
  }
  // a rider id (not a dragon) whose own sheet is live: their conditions, exhaustion and inspiration live there
  function liveRider(id){var p=byId(id);return p&&live(p)?p:null}
  var dmConds={}, dmPend={};   // what the DM sent to live sheets (party/conds), and what their sheets haven't confirmed yet
  function pend(id){
    var pe=dmPend[id], r=rawLink(id); if(!pe) return {};
    Object.keys(pe).forEach(function(k){if(r&&r.at>=pe[k].at)delete pe[k]});
    return pe;
  }
  function condOn(id){
    var p=liveRider(id); if(!p) return play.cond[id]||{};
    var out={}, pe=pend(id); (live(p).conds||[]).forEach(function(k){out[k]=true});
    Object.keys(pe).forEach(function(k){if(k!=='exh'&&k!=='insp')out[k]=pe[k].on});
    return out;
  }
  function exh(id){var p=liveRider(id);if(!p)return play.exh[id]||0;var pe=pend(id).exh;return pe?pe.v:(+live(p).exh||0)}
  function inspOn(id){var p=liveRider(id);if(!p)return !!play.insp[id];var pe=pend(id).insp;return pe?!!pe.on:!!live(p).insp}
  function effMax(c){if(c.max==null)return null;if(c.live)return c.max;return exh(c.id)>=4?Math.floor(c.max/2):c.max}
  function curHp(c){if(c.live)return +c.live.cur||0;var v=play.hp[c.id],m=effMax(c);if(v==null||isNaN(v))return m;return m!=null?Math.min(v,m):v}

  // ---------- Sending to live sheets: damage and healing (party/hp), conditions (party/conds) ----------
  var hpCmds={};
  function sendHp(id,cmd){
    var c=crit(id);
    if(!cloudDb){logs[id]='Sending this to '+(c?c.p.name:id)+'’s sheet needs the online connection. Switch them to Paper to track it here.';return false}
    var q=hpCmds[id]||[], t=Date.now(), last=q.length?Date.parse(q[q.length-1].at):0;
    if(last>=t)t=last+1; cmd.at=new Date(t).toISOString();
    hpCmds[id]=q.concat([cmd]).slice(-8);
    cloudDb.doc('party/hp').set(hpCmds).catch(function(){logs[id]='Couldn’t send that. Check the connection.';softRender()});
    return true;
  }
  var condQueued=false;
  function sendCond(id,k,val){
    var p=byId(id);
    if(!cloudDb){statusMsg='Changing '+(p?p.name:id)+'’s live sheet needs the online connection. Switch them to Paper to track it here instead.';return false}
    var o=Object.assign({at:new Date().toISOString()},val);
    (dmConds[id]||(dmConds[id]={}))[k]=o; (dmPend[id]||(dmPend[id]={}))[k]=o;
    if(!condQueued){condQueued=true;setTimeout(flushConds,0)}
    return true;
  }
  function flushConds(){condQueued=false;if(cloudDb)cloudDb.doc('party/conds').set(dmConds).catch(function(){dmPend={};statusMsg='Couldn’t send that. Check the connection.';render()})}
  // A condition on or off for anyone: a rider on a live sheet gets it through their sheet; everyone else is tracked here.
  function setCondFor(id,c,on){
    if(liveRider(id))return sendCond(id,c,{on:!!on});
    var o=play.cond[id]||(play.cond[id]={}); o[c]=!!on; savePlay(); return true;
  }

  // ---------- Damage types and defenses (5e) ----------
  var TYPES=['untyped','acid','bludgeoning','cold','fire','force','lightning','necrotic','piercing','poison','psychic','radiant','slashing','thunder'];
  var ALIAS={electric:'lightning',electricity:'lightning',elec:'lightning',physical:'bps',bps:'bps'};
  // "acid immune, fire resist" · "resistance: cold, fire" · "fire, cold resistance" · "bps resist"
  function parseDef(s){
    var out={},mode=null,pending=[];
    String(s||'').toLowerCase().split(/[,;.]+/).forEach(function(part){
      var types=[],m=null;
      (part.match(/[a-z]+/g)||[]).forEach(function(w){
        if(/^immun/.test(w))m='immune';else if(/^resist/.test(w))m='resist';else if(/^vuln/.test(w))m='vuln';
        else if(/^advantage$/.test(w)){mode=null;pending=[]}
        else{var t=ALIAS[w]||w;if(t==='bps')types.push('bludgeoning','piercing','slashing');else if(TYPES.indexOf(t)>0)types.push(t);}
      });
      if(m){mode=m;types.concat(pending).forEach(function(t){out[t]=m});pending=[];}
      else if(mode)types.forEach(function(t){out[t]=mode});
      else pending=pending.concat(types);
    });
    return out;
  }
  function defText(s){
    var d=parseDef(s),g={immune:[],resist:[],vuln:[]};
    Object.keys(d).forEach(function(t){g[d[t]].push(t)});
    return [['immune','Immune'],['resist','Resist'],['vuln','Vulnerable']].filter(function(x){return g[x[0]].length}).map(function(x){return x[1]+': '+g[x[0]].join(', ')}).join(' · ');
  }

  function applyHp(c,amt,heal){
    var max=effMax(c),cur=curHp(c);if(cur==null)cur=0;
    var cd=play.cond[c.id]||(play.cond[c.id]={}), ds=play.death[c.id]||{s:0,f:0};
    if(heal){
      if(ds.f>=3){logs[c.id]='Dead. Healing has no effect; it takes a spell like revivify.';return;}
      var nc=max==null?cur+amt:Math.min(max,cur+amt);
      play.hp[c.id]=nc;
      var msg='+'+(nc-cur)+' healed'+(nc-cur<amt?' (capped at max)':'')+' → '+nc;
      if(cur===0&&nc>0){delete play.death[c.id];cd.unconscious=false;msg+='. Conscious again; death saves reset.';}
      logs[c.id]=msg;
    } else {
      var type=lastType[c.id]||'untyped', r=type==='untyped'?null:parseDef(c.def)[type], fin=amt, how='';
      if(r==='immune'){fin=0;how=' (immune)';}
      else{
        if(r==='resist'||cd.petrified){fin=Math.floor(fin/2);how=' (halved: '+(r==='resist'?'resistant':'petrified')+')';}
        if(r==='vuln'){fin=fin*2;how+=' (doubled: vulnerable)';}
      }
      var t=play.temp[c.id]||0, abs=Math.min(t,fin), rest=fin-abs;
      if(abs){play.temp[c.id]=t-abs;how+=', '+abs+' absorbed by temp HP';}
      var msg2='−'+fin+(type==='untyped'?'':' '+type)+how;
      if(cur===0){
        if(rest>0){
          if(max!=null&&rest>=max){ds.f=3;msg2+='. Damage at 0 HP ≥ max HP: instant death.';}
          else{ds.f=Math.min(3,ds.f+1);msg2+='. Hit at 0 HP: +1 death save failure (2 on a crit).'+(ds.f>=3?' Dead.':'');}
          play.death[c.id]=ds;
        }
      } else {
        var left=cur-rest;
        if(left<=0){
          var over=-left; left=0; cd.unconscious=true;
          if(max!=null&&over>=max){play.death[c.id]={s:0,f:3};msg2+=' → 0. Leftover '+over+' ≥ max HP: instant death.';}
          else{play.death[c.id]={s:0,f:0};msg2+=' → 0. Unconscious; roll death saves.';}
          if(cd.concentrating){cd.concentrating=false;msg2+=' Concentration ends.';}
        } else {
          msg2+=' → '+left;
          if(cd.concentrating&&fin>0)msg2+='. Concentration: Con save DC '+Math.max(10,Math.floor(fin/2))+'.';
        }
        play.hp[c.id]=left;
      }
      logs[c.id]=msg2;
    }
    savePlay();
  }

  // ---------- Conditions (5e, 2014 rules) ----------
  var CONDS=[
    ['blinded','Blinded','Blinded: can’t see; fails checks that need sight. Attacks against it have advantage; its attacks have disadvantage.'],
    ['charmed','Charmed','Charmed: can’t attack the charmer or target it with harmful effects; the charmer has advantage on social checks against it.'],
    ['deafened','Deafened','Deafened: can’t hear; fails checks that need hearing.'],
    ['frightened','Frightened','Frightened: disadvantage on checks and attacks while the source is in sight; can’t willingly move closer to it.'],
    ['grappled','Grappled','Grappled: speed 0. Ends if the grappler is incapacitated or it’s moved out of reach.'],
    ['incapacitated','Incapacitated','Incapacitated: no actions or reactions.'],
    ['invisible','Invisible','Invisible: its attacks have advantage; attacks against it have disadvantage.'],
    ['paralyzed','Paralyzed','Paralyzed: incapacitated, can’t move or speak. Fails Str and Dex saves. Attacks against it have advantage; hits from within 5 ft. are crits.'],
    ['petrified','Petrified','Petrified: incapacitated, can’t move or speak. Fails Str and Dex saves. Resistant to all damage (applied above); immune to poison and disease.'],
    ['poisoned','Poisoned','Poisoned: disadvantage on attack rolls and ability checks.'],

  // ---------- Initiative tracker: riders (their dragon acts on the rider's turn) and the DM's enemies; rounds, turns, held turns, timed effects ----------
  // Kept in play.init so it saves online with the rest of the sheet: {list, fx, round, turn, cid, call, notes}.
  // Entries: {id:'pc-<rider>', pc} for a rider and their dragon, {id:'dm-…', name, s:{ac,init}, hp, hpMax} for enemies.
  // list stays sorted: highest initiative first, ties by tb (set from the initiative modifier, or by moving someone).
  // A timed effect counts down when its anchor's turn starts (the turn it was added on), so it ends just before
  // that turn the right number of rounds later, as in the rules.
  var VIEWKEY='arcanum-riders-view', view='party', confirmNewFight=false, fxForm={unit:'1'}, lastRoundKey=null, adding=false, addForm={count:'1',roll:true};
  try{if(localStorage.getItem(VIEWKEY)==='init')view='init'}catch(e){}
  function entry(I,id){return I.list.find(function(e){return e.id===id})||null}
  function ini(){

    if(!I||!Array.isArray(I.list))I=play.init={list:[],fx:[],round:0,turn:'',cid:''};
    if(!Array.isArray(I.fx))I.fx=[];
    var ids=state.party.map(function(p){return p.id});
    I.list=I.list.filter(function(e){return !e.dr&&(!e.pc||ids.indexOf(e.pc)>=0)});   // dragons used to have their own spot
    state.party.forEach(function(p){
      if(!entry(I,'pc-'+p.id))I.list.push({id:'pc-'+p.id,pc:p.id,init:'',tb:0});
    });
    return I;
  }
  function hero(e){return e&&e.pc?byId(e.pc)||null:null}
  function eName(e){var p=hero(e);return p?p.name+' / '+dName(p):(e.name||'Enemy')}
  // Timers can be on a rider ('pc-<rider>'), on their dragon alone ('dr-<rider>'), the whole party, or an enemy.
  function entryOf(cid){return /-dragon$/.test(cid)?'dr-'+cid.slice(0,-7):'pc-'+cid}
  function turnOf(cid){return 'pc-'+cid.replace(/-dragon$/,'')}
  function whoName(I,id){
    var m=/^(pc|dr)-(.+)$/.exec(id||''), p=m&&byId(m[2]);
    if(p)return m[1]==='dr'?dName(p):p.name;
    var e=id&&entry(I,id);return e?eName(e):'';
  }
  function initMod(e){
    var p=hero(e);
    if(!p){var mm=e.s&&String(e.s.init||'').match(/[+−-]?\d+/);return mm?+mm[0].replace('−','-'):null}
    return stat(p,'init');
  }
  function rolled(e){return e.init!==''&&e.init!=null&&!isNaN(+e.init)}
  function inTurn(e){return rolled(e)&&!e.held}
  function sortInit(I){
    var pos={};I.list.forEach(function(e,i){pos[e.id]=i});
    I.list.sort(function(a,b){
      var ra=rolled(a),rb=rolled(b); if(ra!==rb) return ra?-1:1; if(!ra) return pos[a.id]-pos[b.id];
      return (+b.init-+a.init)||((+b.tb||0)-(+a.tb||0))||(pos[a.id]-pos[b.id]);
    });
  }
  // Put e just before (or after) t in the order: e takes t's initiative, as with a readied action or a swap.
  function placeBy(I,e,t,after){
    var rest=I.list.filter(function(x){return x!==e&&rolled(x)});
    // give tied entries distinct tie-breaks first, so there is room between them
    for(var a=0;a<rest.length;){var b=a;while(b+1<rest.length&&+rest[b+1].init===+rest[a].init)b++;
      for(var j=a;j<b;j++)if(!((+rest[j].tb||0)>(+rest[j+1].tb||0))){for(var k=a;k<=b;k++)rest[k].tb=b-k;break}
      a=b+1;}
    var i=rest.indexOf(t), nb=rest[after?i+1:i-1];

    sortInit(I);

  // The next (or previous) entry whose turn it can be, and whether that passes the top of the round.
  function peek(I,dir){

  function anchored(I,f){var a=f.anchor&&entry(I,f.anchor);return !!(a&&inTurn(a))}

    I.turn=nx.e.id;

  }

  function ended(f){return f.total!=null&&(f.el||0)>=f.total}
  // A timer named after a condition (Stunned, Restrained…) puts it on whoever the timer is on, and takes it off again
  // when the timer ends or is removed. f.applied lists the creatures it was put on; f.off marks one already taken off.
  function fxCond(f){return f.cond||condIdFor(f.name)}

  function linkFx(I,f,on){
    var c=fxCond(f); if(!c) return;

    want.filter(function(h){return had.indexOf(h)<0}).forEach(function(h){setCondFor(h,c,true)});

  }
  function critName(cid){var c=crit(cid);return c?c.name:cid}
  function note(I,eid,txt){var L=(I.notes||(I.notes={}))[eid]||(I.notes[eid]=[]);if(L.indexOf(txt)<0)L.push(txt)}

  // The DM took a condition off by hand: drop that creature from any timer that put it there.
  function dropCondTimers(cid,c){

  function copyJson(){
    var ta=document.getElementById('export-text'), st=document.getElementById('export-status');
    function fallback(){ta.focus();ta.select();st.textContent='Text selected. Press Ctrl+C to copy.';}
    try{navigator.clipboard.writeText(ta.value).then(function(){st.textContent='Copied';},fallback);}catch(err){fallback();}
  }
  function downloadJson(){
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJson()],{type:'application/json'}));
    a.download='arcanum-riders-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
    document.getElementById('export-status').textContent='Backup downloaded';
  }
  function openImport(){
    dialog('import-dlg','Import backup','<p class="minor">Paste backup text, or choose a backup file. This replaces the whole sheet'+(cloud?' on every device.':' on this device.')+'</p>'+
      '<input type="file" id="import-file" accept=".json,application/json" aria-label="Backup file">'+
      '<textarea id="import-text" style="margin-top:8px" placeholder="Paste backup text here" aria-label="Backup text"></textarea>'+
      '<div class="dlg-actions"><button class="primary" id="load-json">Import</button><span class="status" id="import-status"></span></div>');
  }
  document.addEventListener('change',function(e){
    if(e.target.id!=='import-file'||!e.target.files[0])return;
    var fr=new FileReader();fr.onload=function(){document.getElementById('import-text').value=fr.result;importText(fr.result);};fr.readAsText(e.target.files[0]);
  });
  function importText(txt){
    var st=document.getElementById('import-status');
    try{var d=JSON.parse(txt);if(!d||!Array.isArray(d.party))throw 0;
      state={updated:d.updated||new Date().toISOString().slice(0,10),party:d.party};fixParty();
      play=d.play&&typeof d.play==='object'?d.play:{};normPlay();logs={};rolls={};
      saveState();savePlay();statusMsg='Backup imported';
      var dl=document.getElementById('import-dlg');if(dl)dl.close();render();
    }catch(err){if(st)st.textContent='That isn’t a backup from this sheet. Use the text or file from Export backup.';}
  }

  // ---------- Online saving: on the website (js/cloud.js), the whole sheet lives in one shared document, party/main ----------
  var cloudDb=null, cloud=null, cloudTimer=null, cloudPending=false, cloudBusy=false, cloudAgain=false, cloudRemote='';
  function cloudBody(){return {state:state,play:play}}
  // Key-order-independent fingerprint, so a document read back from the server compares equal to what was sent.
  function canon(v){
    if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
    if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(function(k){return v[k]!==undefined}).map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';
    return JSON.stringify(v);
  }
  function cloudPush(){
    if(!cloud)return;
    cloudPending=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(function(){cloudPending=false;cloudWrite()},700);
  }
  function cloudWrite(){
    if(!cloud)return;
    if(cloudBusy){cloudAgain=true;return}
    var body=JSON.parse(JSON.stringify(cloudBody())), sig=canon(body);
    if(sig===cloudRemote)return;
    cloudBusy=true;
    cloud.set(body).then(function(){cloudRemote=sig;}).catch(function(err){
      var c=err&&err.code;
      if(c==='invalid_argument'){statusMsg='This copy is view-only; changes stay on this device.';cloud=null;}
      else if(c==='quota_exceeded'||c==='resource_exhausted'){statusMsg='Online storage is full. Export a backup.';}
      else {statusMsg='Couldn’t save online. Retrying…';setTimeout(cloudPush,3000);}
      softRender();
    }).then(function(){cloudBusy=false;if(cloudAgain){cloudAgain=false;cloudWrite();}});
  }
  // Take what another device saved, unless this device is mid-edit.
  function cloudApply(d){
    if(!d||!d.state||!Array.isArray(d.state.party))return;
    // Local changes not yet sent win; they go out on the next write.
    if(editing||cloudPending||cloudBusy)return;
    var sig=canon(d);
    if(sig===cloudRemote)return;
    cloudRemote=sig;
    if(sig===canon(cloudBody()))return;
    state=JSON.parse(JSON.stringify(d.state));fixParty();
    play=JSON.parse(JSON.stringify(d.play||{}));normPlay();
    put(STORE,state);put(PLAY,play);
    softRender();
  }
  function cloudStart(){
    var cl=window.claude; if(!cl||!cl.use)return;
    cl.use('db').then(function(db){
      if(!db)return;
      var ref=db.doc('party/main');
      return ref.get().then(function(snap){
        cloud=ref;cloudDb=db;
        if(snap.exists)cloudApply(snap.data());
        else cloudWrite();  // first time online: upload what this device has
        statusMsg='Saved online';render();
        ref.onSnapshot(function(s){if(s.exists&&!s.metadata.hasPendingWrites)cloudApply(s.data())},function(){});
        // players' Hold, End turn and initiative rolls from their own sheets
        Object.keys(SHEET_PAGES).forEach(function(id){db.doc('party/turn-'+id).onSnapshot(function(s){if(s.exists)takeReply(id,s.data())},function(){})});
        lastRoundKey=null;postRound();
        // what was already sent to live sheets (kept whole, since each write replaces the document)
        db.doc('party/hp').onSnapshot(function(s){if(!s.metadata||!s.metadata.hasPendingWrites)hpCmds=(s.exists&&s.data())||{}},function(){});
        db.doc('party/conds').onSnapshot(function(s){if(!s.metadata||!s.metadata.hasPendingWrites)dmConds=(s.exists&&s.data())||{}},function(){});
        // Hidecarved Wards, shared with Breya's sheet and every rider's sheet
        db.doc('party/wards').onSnapshot(function(s){
          if(s.metadata&&s.metadata.hasPendingWrites)return;
          var d=s.exists?s.data():null;if(d&&sharedWards&&sharedWards.at>d.at)return;
          sharedWards=d&&d.wards?d:null;softRender();
        },function(){});
        // riders' own sheets post their numbers here, live
        if(db.collection)db.collection('reports').onSnapshot(function(qs){
          var changed=false;qs.docs.forEach(function(d){if(d.exists&&acceptReport(d.data()))changed=true});
          if(changed)softRender();
        },function(){});
      });
    }).catch(function(){});
  }

  window.addEventListener('beforeunload',function(e){if(editing&&dirty){e.preventDefault();e.returnValue='';}});
  render();
  // DM only: nothing loads from online until this device has the DM password (js/cloud.js)
  if(window.claude&&window.claude.use)window.claude.use('dm').then(function(ok){if(ok)cloudStart()});
})();
</script>
